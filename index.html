<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,'Microsoft YaHei',sans-serif;color:#eef5f0}body{display:flex;background:#f6f8f5}.sidebar{width:228px;flex:none;background:#183d31;display:flex;flex-direction:column;padding:30px 18px;gap:0}.brand{display:flex;align-items:center;gap:11px;padding:0 5px}.brand img{width:38px;height:38px;object-fit:cover;border-radius:9px}.brand strong{font-size:17px;display:block}.brand small{font-size:10px;color:#a7c1b1;display:block;margin-top:4px}.label{margin:60px 12px 14px;color:#8aa699;font-size:10px;letter-spacing:2px}.nav{display:grid;gap:6px}.nav button{border:0;color:#b9cfc1;background:transparent;border-radius:8px;padding:14px;text-align:left;font:600 13px inherit;cursor:pointer;white-space:nowrap}.nav button:hover,.nav button[aria-selected=true]{background:#31584a;color:white}.nav button{display:flex;align-items:center;gap:10px}.side-note{margin:auto 9px 0;font-size:11px;line-height:1.7;color:#9fb8a9}.stage{flex:1;min-width:0;height:100vh}.stage iframe{border:0;width:100%;height:100%;display:block;background:#f6f8f5}.stage iframe[hidden]{display:none}@media(max-width:700px){body{display:block}.sidebar{width:100%;padding:12px 16px;gap:12px}.brand img{width:32px;height:32px}.brand small,.label,.side-note{display:none}.nav{display:flex;gap:6px}.nav button{flex:1;padding:10px 8px;text-align:center;font-size:12px}.stage{height:calc(100vh - 107px)}}
</style></head><body><aside class="sidebar"><div class="brand"><img src="fba/logo.png" alt="公司标志"><div><strong>Workspace</strong></div></div><div class="label">工作空间</div><nav class="nav" aria-label="选择工作台"><button type="button" data-target="fba" aria-selected="true">货件核对表生成</button><button type="button" data-target="claim" aria-selected="false">索赔装箱单生成</button><button type="button" data-target="quote" aria-selected="false">物流报价表生成</button></nav><div class="side-note">数据在当前浏览器处理<br>切换工作台不会清空已导入的数据</div></aside><main class="stage"><iframe id="fba" title="货件核对表生成" src="fba/index.html"></iframe><iframe id="claim" title="索赔装箱单生成" src="claim/index.html" hidden></iframe><iframe id="quote" title="物流报价表生成" src="quote/index.html" hidden></iframe></main><script>
document.querySelectorAll('[data-target]').forEach(button=>button.addEventListener('click',()=>{const target=button.dataset.target;document.querySelectorAll('[data-target]').forEach(b=>b.setAttribute('aria-selected',String(b===button)));document.querySelectorAll('.stage iframe').forEach(frame=>frame.hidden=frame.id!==target)}));
</script></body></html>
